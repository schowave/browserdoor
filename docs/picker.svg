<svg xmlns="http://www.w3.org/2000/svg" width="400" height="336" viewBox="0 0 400 336" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>Doorman picker panel (illustration)</title>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="40" y="24" width="320" height="284" rx="14" fill="#f7f7f8" stroke="#d9d9de" filter="url(#shadow)"/>

  <!-- url row -->
  <text x="58" y="52" font-size="13" fill="#6e6e73">https://github.com/schowave/doorman</text>
  <rect x="326" y="38" width="18" height="18" rx="4" fill="none" stroke="#8e8e93" stroke-width="1.4"/>
  <rect x="330" y="34" width="18" height="18" rx="4" fill="#f7f7f8" stroke="#8e8e93" stroke-width="1.4"/>
  <line x1="50" y1="66" x2="350" y2="66" stroke="#e1e1e6"/>

  <!-- row 1: Zen space, selected -->
  <rect x="48" y="74" width="304" height="34" rx="7" fill="#0a84ff" fill-opacity="0.18"/>
  <rect x="58" y="79" width="24" height="24" rx="6" fill="#f29bbb"/>
  <path d="M64 89h12v8h-12z M67 86h6v3h-6z" fill="#1d1d1f" fill-opacity="0.75"/>
  <text x="94" y="96" font-size="14" fill="#1d1d1f">Work</text>
  <rect x="320" y="82" width="20" height="18" rx="4" fill="#e5e5ea"/>
  <text x="330" y="95" font-size="11" font-family="SF Mono, Menlo, monospace" fill="#6e6e73" text-anchor="middle">1</text>

  <!-- row 2: Zen space -->
  <rect x="58" y="117" width="24" height="24" rx="6" fill="#6cbad9"/>
  <circle cx="70" cy="129" r="6" fill="#1d1d1f" fill-opacity="0.75"/>
  <ellipse cx="70" cy="129" rx="10" ry="3" fill="none" stroke="#1d1d1f" stroke-opacity="0.75" stroke-width="1.4"/>
  <text x="94" y="134" font-size="14" fill="#1d1d1f">Client</text>
  <rect x="320" y="120" width="20" height="18" rx="4" fill="#e5e5ea"/>
  <text x="330" y="133" font-size="11" font-family="SF Mono, Menlo, monospace" fill="#6e6e73" text-anchor="middle">2</text>

  <!-- row 3: Zen space -->
  <rect x="58" y="155" width="24" height="24" rx="6" fill="#34e895"/>
  <text x="70" y="172" font-size="13" font-weight="600" fill="#1d1d1f" fill-opacity="0.75" text-anchor="middle">P</text>
  <text x="94" y="172" font-size="14" fill="#1d1d1f">Personal</text>
  <rect x="320" y="158" width="20" height="18" rx="4" fill="#e5e5ea"/>
  <text x="330" y="171" font-size="11" font-family="SF Mono, Menlo, monospace" fill="#6e6e73" text-anchor="middle">3</text>

  <!-- row 4: Chrome profile -->
  <circle cx="70" cy="205" r="11" fill="#db4437"/>
  <path d="M70 205 L79.5 199.5 A11 11 0 0 1 75.5 214.5 Z" fill="#f4b400"/>
  <path d="M70 205 L75.5 214.5 A11 11 0 0 1 60.5 199.5 Z" fill="#0f9d58"/>
  <circle cx="70" cy="205" r="4.5" fill="#4285f4" stroke="#fff" stroke-width="1.5"/>
  <text x="94" y="210" font-size="14" fill="#1d1d1f">Google Chrome › Work</text>
  <rect x="320" y="196" width="20" height="18" rx="4" fill="#e5e5ea"/>
  <text x="330" y="209" font-size="11" font-family="SF Mono, Menlo, monospace" fill="#6e6e73" text-anchor="middle">4</text>

  <!-- row 5: Chrome profile -->
  <circle cx="70" cy="243" r="11" fill="#db4437"/>
  <path d="M70 243 L79.5 237.5 A11 11 0 0 1 75.5 252.5 Z" fill="#f4b400"/>
  <path d="M70 243 L75.5 252.5 A11 11 0 0 1 60.5 237.5 Z" fill="#0f9d58"/>
  <circle cx="70" cy="243" r="4.5" fill="#4285f4" stroke="#fff" stroke-width="1.5"/>
  <text x="94" y="248" font-size="14" fill="#1d1d1f">Google Chrome › Personal</text>
  <rect x="320" y="234" width="20" height="18" rx="4" fill="#e5e5ea"/>
  <text x="330" y="247" font-size="11" font-family="SF Mono, Menlo, monospace" fill="#6e6e73" text-anchor="middle">5</text>

  <!-- row 6: Safari -->
  <circle cx="70" cy="281" r="11" fill="#1e90ff"/>
  <circle cx="70" cy="281" r="9" fill="#fff"/>
  <path d="M70 274 L72.5 281 L70 288 L67.5 281 Z" fill="#ff3b30" transform="rotate(45 70 281)"/>
  <text x="94" y="286" font-size="14" fill="#1d1d1f">Safari</text>
  <rect x="320" y="272" width="20" height="18" rx="4" fill="#e5e5ea"/>
  <text x="330" y="285" font-size="11" font-family="SF Mono, Menlo, monospace" fill="#6e6e73" text-anchor="middle">6</text>

  <!-- mouse pointer -->
  <path d="M30 14 L30 36 L35.5 31 L39 39 L42 37.6 L38.6 29.8 L45.5 29.6 Z" fill="#1d1d1f" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
