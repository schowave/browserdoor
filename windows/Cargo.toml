[workspace]
resolver = "3"
members = ["core", "app"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/schowave/browserdoor"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
