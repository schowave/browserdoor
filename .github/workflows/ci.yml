name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: make test
      - name: Build app bundle
        run: make app
      - name: Check bundle
        run: |
          test -x build/Doorman.app/Contents/MacOS/Doorman
          codesign --verify build/Doorman.app
      - name: Check formula template
        run: scripts/check-formula.sh
