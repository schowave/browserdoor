name: Retry on runner shortage

# GitHub sometimes has no macOS runner free: a job then fails with "The job was not acquired by
# Runner of type hosted even after multiple attempts", or loses its runner midway. That says
# nothing about the code, so the failed jobs are started again, up to two more times. A run that
# failed for any other reason is left alone. (Rerunning release jobs is safe; see release.yml.)

on:
  workflow_run:
    workflows: [CI, Release, Auto release, CodeQL, Pages]
    types: [completed]

permissions:
  actions: write
  checks: read

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.event.workflow_run.id }}
    steps:
      - name: Rerun jobs that never got a runner
        run: |
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .id')"
          messages="$(for job in $jobs; do
            gh api "repos/$GITHUB_REPOSITORY/check-runs/$job/annotations" --jq '.[].message'
          done)"
          if printf '%s\n' "$messages" | grep -qE 'not acquired by Runner|lost communication with the server|runner has received a shutdown signal'; then
            echo "::notice::No runner for run $RUN; starting its failed jobs again"
            gh run rerun "$RUN" --failed --repo "$GITHUB_REPOSITORY"
          else
            echo "Run $RUN failed for another reason; not retrying"
          fi
