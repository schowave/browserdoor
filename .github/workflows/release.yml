name: Release

# Runs for a pushed tag like v0.1.0, or when auto-release calls it with a tag it just created.
# → test and build, create the GitHub release, update the Homebrew tap.
# Needs the secret TAP_GITHUB_TOKEN: a fine-grained token with contents:write on schowave/homebrew-tap.
# Safe to re-run: an existing release is kept, an unchanged formula is not committed again.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.1
        required: true
        type: string
    secrets:
      TAP_GITHUB_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: jdx/mise-action@v5

      - name: Test
        run: mise run test

      - name: Build app bundle
        run: VERSION="${TAG#v}" mise run app

      - name: Check formula template
        run: mise run check-formula

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --generate-notes --verify-tag

      - name: Render formula
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          sha=$(curl -sSfL "$url" | shasum -a 256 | cut -d' ' -f1)
          .mise/tasks/render-formula "${TAG#v}" "$sha" > doorman.rb
          cat doorman.rb

      - name: Push formula to tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_GITHUB_TOKEN is empty or missing"
            exit 1
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/schowave/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp doorman.rb tap/Formula/doorman.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/doorman.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged"
            exit 0
          fi
          git commit -m "doorman ${TAG#v}"
          git push
