name: Release

# Runs for a pushed tag like v0.1.0, or when auto-release calls it with a tag it just created.
# → test and build, create the GitHub release, build bottles (Apple Silicon from macOS 14,
#   Intel from macOS 15) and attach them to the release, update the Homebrew tap.
# A failed bottle build does not block the tap update: the formula then simply carries fewer
# bottles, and those Macs build from source. If no bottle was built at all, the tap is left alone.
# Bottles already attached to the release (tarball plus JSON) are reused on a re-run, so the
# formula's sha256 values stay valid; delete both assets to rebuild one.
# Needs the secret TAP_GITHUB_TOKEN: a fine-grained token with contents:write on schowave/homebrew-tap.
# Safe to re-run: an existing release is kept, an unchanged formula is not committed again.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.1
        required: true
        type: string
    secrets:
      TAP_GITHUB_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: jdx/mise-action@v5

      - name: Test
        run: mise run test

      - name: Build app bundle
        run: VERSION="${TAG#v}" mise run app

      - name: Check formula template
        run: mise run check-formula

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --generate-notes --verify-tag

      - name: Render formula
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          sha=$(curl -sSfL "$url" | shasum -a 256 | cut -d' ' -f1)
          .mise/tasks/render-formula "${TAG#v}" "$sha" > doorman.rb
          cat doorman.rb

      - uses: actions/upload-artifact@v7
        with:
          name: formula
          path: doorman.rb
          overwrite: true

  bottle:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        # Homebrew pours a bottle on its own macOS version and newer ones.
        include:
          - os: macos-14
            bottle_tag: arm64_sonoma
          - os: macos-15-intel
            bottle_tag: sequoia
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: formula

      - name: Reuse a bottle from an earlier run
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          BOTTLE_TAG: ${{ matrix.bottle_tag }}
        run: |
          # The JSON is uploaded after the tarball, so its presence means the bottle is complete.
          json="doorman--${TAG#v}.${BOTTLE_TAG}.bottle.json"
          if gh release download "$TAG" --pattern "$json" --dir bottles 2>/dev/null; then
            echo "Reusing $json from the release"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode 16
        # macos-14 defaults to Xcode 15; Package.swift needs Swift 6.
        if: matrix.os == 'macos-14' && steps.existing.outputs.found != 'true'
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' \
            | grep -E '/Xcode_16(\.[0-9]+)*\.app$' | sort -V | tail -n 1 || true)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 16 on this runner"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Build bottle
        if: steps.existing.outputs.found != 'true'
        run: .mise/tasks/bottle doorman.rb "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" bottles

      - name: brew test
        if: steps.existing.outputs.found != 'true'
        run: brew test schowave/tap/doorman

      - name: Attach bottle to the release
        if: steps.existing.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tarball without JSON is left over from an aborted run; the tap never points to it.
          gh release upload "$TAG" bottles/*.tar.gz --clobber
          gh release upload "$TAG" bottles/*.json

      - uses: actions/upload-artifact@v7
        with:
          name: bottle-${{ matrix.os }}
          path: bottles/*.json
          overwrite: true

  tap:
    needs: [release, bottle]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: formula

      - uses: actions/download-artifact@v8
        with:
          pattern: bottle-*
          path: bottles
          merge-multiple: true

      - name: Push formula with bottles to tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_GITHUB_TOKEN is empty or missing"
            exit 1
          fi
          # Clone where brew finds the tap, so `brew bottle --merge` can write into it.
          tap="$(brew --repository)/Library/Taps/schowave/homebrew-tap"
          rm -rf "$tap"
          if ! ls bottles/*.json >/dev/null 2>&1; then
            echo "::error::No bottle was built; leaving the tap unchanged"
            exit 1
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/schowave/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Formula"
          cp doorman.rb "$tap/Formula/doorman.rb"
          brew bottle --merge --write --no-commit bottles/*.json
          cat "$tap/Formula/doorman.rb"
          cd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/doorman.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged"
            exit 0
          fi
          git commit -m "doorman ${TAG#v}"
          git push
