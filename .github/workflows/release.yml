name: Release

# Runs for a pushed tag like v0.1.0, or when auto-release calls it with a tag it just created.
# → test and build, create the GitHub release, build bottles (macOS 15 or later, Apple Silicon
#   and Intel; GitHub has no macOS 14 runners any more) and attach them to the release, update the Homebrew tap.
# A failed bottle build does not block the tap update: the formula then simply carries fewer
# bottles, and those Macs build from source. If no bottle was built at all, the tap is left alone.
# Bottles already attached to the release (tarball plus JSON) are reused on a re-run, so the
# formula's sha256 values stay valid; delete both assets to rebuild one.
# Needs the secret TAP_GITHUB_TOKEN: a fine-grained token with contents:write on schowave/homebrew-tap.
# The dmg job adds the download build (signed with Developer ID, notarized, updating itself with
# Sparkle) and its appcast. The DMG is attached twice: Browserdoor-<version>.dmg, which the appcast
# names, and Browserdoor.dmg, so releases/latest/download/Browserdoor.dmg (the homepage's download
# link) always fetches the newest one. It needs the secrets DEVELOPER_ID_CERT_P12 (base64 of the .p12),
# DEVELOPER_ID_CERT_PASSWORD, NOTARY_API_KEY (the .p8 file's text), NOTARY_API_KEY_ID,
# NOTARY_API_ISSUER and SPARKLE_PRIVATE_KEY, plus the variable SPARKLE_PUBLIC_KEY. Until all of
# them exist it skips itself. Without a DMG (a secret is missing, or the job failed), the release
# gets the previous release's appcast and Browserdoor.dmg, so neither the update feed nor the
# download link answers 404. The release becomes
# "latest" only at the end (job latest).
# Safe to re-run: an existing release is kept, an unchanged formula is not committed again.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.1
        required: true
        type: string
    secrets:
      TAP_GITHUB_TOKEN:
        required: true
      DEVELOPER_ID_CERT_P12:
        required: false
      DEVELOPER_ID_CERT_PASSWORD:
        required: false
      NOTARY_API_KEY:
        required: false
      NOTARY_API_KEY_ID:
        required: false
      NOTARY_API_ISSUER:
        required: false
      SPARKLE_PRIVATE_KEY:
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Test
        run: mise run test

      - name: Build app bundle
        run: VERSION="${TAG#v}" mise run app

      - name: Check formula template
        run: mise run check-formula

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --generate-notes --verify-tag --latest=false

      - name: Render formula
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          sha=$(curl -sSfL "$url" | shasum -a 256 | cut -d' ' -f1)
          .mise/tasks/render-formula "${TAG#v}" "$sha" > browserdoor.rb
          cat browserdoor.rb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: formula
          path: browserdoor.rb
          overwrite: true

  dmg:
    needs: release
    runs-on: macos-26
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
      DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
      NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
      NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
      NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    steps:
      - name: Decide whether to build
        id: gate
        run: |
          # The appcast is uploaded after the DMG, so its presence means both are complete.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx appcast.xml; then
            echo "The release already has appcast.xml; delete it (and the DMG) to rebuild."
            exit 0
          fi
          for name in DEVELOPER_ID_CERT_P12 DEVELOPER_ID_CERT_PASSWORD NOTARY_API_KEY NOTARY_API_KEY_ID \
                      NOTARY_API_ISSUER SPARKLE_PRIVATE_KEY SPARKLE_PUBLIC_KEY; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::warning::$name is not set; no DMG for this release"
              echo "carry=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "build=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.build == 'true'
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build the download app
        if: steps.gate.outputs.build == 'true'
        run: SPARKLE=1 DEV_BUILD=0 VERSION="${TAG#v}" .mise/tasks/app

      - name: Import the Developer ID certificate
        id: keychain
        if: steps.gate.outputs.build == 'true'
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$DEVELOPER_ID_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity in DEVELOPER_ID_CERT_P12"
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Sign and pack the DMG
        if: steps.gate.outputs.build == 'true'
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: VERSION="${TAG#v}" .mise/tasks/dmg "$IDENTITY"

      - name: Notarize and staple
        if: steps.gate.outputs.build == 'true'
        run: |
          key="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$NOTARY_API_KEY" > "$key"
          notary() { xcrun notarytool "$@" --key "$key" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER"; }
          result="$(notary submit build/Browserdoor.dmg --wait --timeout 30m --output-format json)"
          echo "$result"
          if [ "$(echo "$result" | jq -r .status)" != Accepted ]; then
            notary log "$(echo "$result" | jq -r .id)" || true
            echo "::error::Notarization failed"
            exit 1
          fi
          xcrun stapler staple build/Browserdoor.dmg
          spctl --assess --type open --context context:primary-signature --verbose build/Browserdoor.dmg

      - name: Sign the update and write the appcast
        if: steps.gate.outputs.build == 'true'
        run: |
          dmg="build/Browserdoor-${TAG#v}.dmg"
          cp build/Browserdoor.dmg "$dmg"
          signature="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/sparkle/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - "$dmg")"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$dmg")"
          .mise/tasks/appcast "$TAG" "$url" "$signature" > build/appcast.xml
          cat build/appcast.xml

      - name: Attach DMG and appcast to the release
        if: steps.gate.outputs.build == 'true'
        run: |
          gh release upload "$TAG" "build/Browserdoor-${TAG#v}.dmg" build/Browserdoor.dmg --clobber
          gh release upload "$TAG" build/appcast.xml --clobber

      # SUFeedURL is releases/latest/download/appcast.xml, and the homepage links
      # releases/latest/download/Browserdoor.dmg: a release without them would answer 404. Carry the
      # previous release's over (DMG failed, or a secret is missing), so download installs stay on
      # the previous DMG, and new users get it, until a rerun or the next release.
      - name: Keep the previous appcast and DMG
        if: ${{ !cancelled() && (steps.gate.outputs.carry == 'true' || (failure() && steps.gate.outputs.build == 'true')) }}
        run: |
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --json tagName --jq ".[].tagName | select(. != \"$TAG\")" | head -n 1)"
          if [ -n "$previous" ] && gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern appcast.xml \
            --dir "$RUNNER_TEMP/previous"; then
            gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern Browserdoor.dmg --dir "$RUNNER_TEMP/previous" \
              && gh release upload "$TAG" "$RUNNER_TEMP/previous/Browserdoor.dmg" --repo "$GITHUB_REPOSITORY" --clobber \
              || echo "::warning::$previous has no Browserdoor.dmg to carry over."
            gh release upload "$TAG" "$RUNNER_TEMP/previous/appcast.xml" --repo "$GITHUB_REPOSITORY" --clobber
            echo "::warning::No DMG for $TAG; attached the appcast and Browserdoor.dmg of $previous. Delete both and rerun this job to build the DMG."
          else
            echo "::warning::No DMG for $TAG, and no earlier appcast to carry over."
          fi

      - name: Remove the signing keychain
        if: always() && steps.keychain.outcome != 'skipped'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  bottle:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        # Homebrew pours a bottle on its own macOS version and newer ones.
        include:
          - os: macos-15
            bottle_tag: arm64_sequoia
          - os: macos-15-intel
            bottle_tag: sequoia
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: formula

      - name: Reuse a bottle from an earlier run
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          BOTTLE_TAG: ${{ matrix.bottle_tag }}
        run: |
          # The JSON is uploaded after the tarball, so its presence means the bottle is complete.
          json="browserdoor--${TAG#v}.${BOTTLE_TAG}.bottle.json"
          if gh release download "$TAG" --pattern "$json" --dir bottles 2>/dev/null; then
            echo "Reusing $json from the release"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build bottle
        if: steps.existing.outputs.found != 'true'
        run: .mise/tasks/bottle browserdoor.rb "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" bottles

      - name: brew test
        if: steps.existing.outputs.found != 'true'
        run: brew test schowave/tap/browserdoor

      - name: Attach bottle to the release
        if: steps.existing.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tarball without JSON is left over from an aborted run; the tap never points to it.
          gh release upload "$TAG" bottles/*.tar.gz --clobber
          gh release upload "$TAG" bottles/*.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bottle-${{ matrix.os }}
          path: bottles/*.json
          overwrite: true

  tap:
    needs: [release, bottle]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: macos-26
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: formula

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: bottle-*
          path: bottles
          merge-multiple: true

      - name: Push formula with bottles to tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_GITHUB_TOKEN is empty or missing"
            exit 1
          fi
          # Clone where brew finds the tap, so `brew bottle --merge` can write into it.
          tap="$(brew --repository)/Library/Taps/schowave/homebrew-tap"
          rm -rf "$tap"
          if ! ls bottles/*.json >/dev/null 2>&1; then
            echo "::error::No bottle was built; leaving the tap unchanged"
            exit 1
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/schowave/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Formula"
          cp browserdoor.rb "$tap/Formula/browserdoor.rb"
          # Up to 0.2.x the formula was `doorman`: drop it and record the rename, so
          # `brew upgrade` moves existing installs over to `browserdoor`.
          git -C "$tap" rm -q --ignore-unmatch Formula/doorman.rb
          renames="$tap/formula_renames.json"
          [ -f "$renames" ] || echo '{}' > "$renames"
          jq '. + {"doorman": "browserdoor"}' "$renames" > "$renames.new" && mv "$renames.new" "$renames"
          # Homebrew only loads formulae from a hand-cloned tap once it is trusted.
          brew trust --formula schowave/tap/browserdoor
          brew bottle --merge --write --no-commit bottles/*.json
          cat "$tap/Formula/browserdoor.rb"
          cd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/browserdoor.rb formula_renames.json
          if git diff --cached --quiet; then
            echo "Formula unchanged"
            exit 0
          fi
          git commit -m "browserdoor ${TAG#v}"
          git push

  # The release is created with --latest=false and only becomes "latest" here, once its DMG and
  # appcast (or the carried-over one) are attached: SUFeedURL and the Homebrew build's update
  # check both follow releases/latest, so neither sees a half-finished release.
  latest:
    needs: [release, dmg, tap]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark the release as latest
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
