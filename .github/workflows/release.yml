name: Release

# Push a tag like v0.1.0 → test, create the GitHub release, update the Homebrew tap.
# Needs the secret TAP_GITHUB_TOKEN: a fine-grained token with contents:write on schowave/homebrew-tap.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: make test

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Render formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sha=$(curl -sSfL "$url" | shasum -a 256 | cut -d' ' -f1)
          sed -e "s/VERSION/${version}/g" -e "s/SHA256/${sha}/" \
              -e '/^# Template for/d' -e '/^# The release workflow/d' \
              packaging/homebrew/doorman.rb > doorman.rb
          cat doorman.rb

      - name: Push formula to tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/schowave/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp doorman.rb tap/Formula/doorman.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/doorman.rb
          git commit -m "doorman ${GITHUB_REF_NAME#v}"
          git push
