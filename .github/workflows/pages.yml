name: Pages

# Publishes the homepage (site/, assembled by .mise/tasks/site) to GitHub Pages
# at https://schowave.github.io/browserdoor/. Needs Pages set to "GitHub Actions"
# under Settings → Pages.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/demo.gif
      - docs/social/preview.png
      - Resources/Icon/AppIcon.svg
      - .mise/tasks/site
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assemble site
        run: .mise/tasks/site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
