name: Auto release

# When a Renovate update lands on main and the app itself changed since the last release
# (Sources/, Resources/, Package.swift/.resolved), tag the next patch version and release it.
# Updates that only touch CI or lint tooling are not released.
# The tag is created through the API, and tags made with GITHUB_TOKEN don't trigger other
# workflows, so the release workflow is called directly. Does nothing until a v* tag exists.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.head_commit.author.name == 'renovate[bot]'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Decide on a release
        id: next
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "HEAD is already tagged."
            exit 0
          fi
          if ! .mise/tasks/app-changed-since-release; then
            echo "No app changes since the last release; nothing to release."
            exit 0
          fi
          tag="$(.mise/tasks/next-patch-version)"
          if [ -z "$tag" ]; then
            echo "No v* tag yet; create the first release by hand."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.next.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
